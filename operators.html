<!DOCTYPE html>
<html>
<head>
    <title>Basic Arithmetic Operations</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }
        input, button {
            margin: 5px 0;
            padding: 5px;
            font-size: 16px;
        }
        .output {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h3>Enter two numbers</h3>
<label for="aInput">a: </label>
<input type="number" id="aInput" placeholder="Enter a"><br>
<label for="bInput">b: </label>
<input type="number" id="bInput" placeholder="Enter b"><br>

<button onclick="calculate()">Calculate</button>

<div class="output" id="output"></div>

<script>
function calculate() {
    // Get input values
    var a = parseFloat(document.getElementById("aInput").value);
    var b = parseFloat(document.getElementById("bInput").value);

    // Perform operations
    var sum = a + b;
    var diff = a - b;
    var product = a * b;
    var quotient = a / b;
    var preInc = ++a;
    var preDec = --b;

    // Display results
    var outDiv = document.getElementById("output");
    outDiv.innerHTML = 
        "Sum (a + b): " + sum + "<br>" +
        "Difference (a - b): " + diff + "<br>" +
        "Product (a * b): " + product + "<br>" +
        "Quotient (a / b): " + quotient + "<br>" +
        "Pre-increment (++a): " + preInc + "<br>" +
        "Pre-decrement (--b): " + preDec;
}
</script>

</body>
</html>
