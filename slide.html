<!DOCTYPE html>
<html>
<head>
    <title>Food Obsession Slides</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #fff1c1, #ffd6a5);
        }

        .slide {
            display: none;
            font-size: 26px;
            padding: 40px;
            background: #ffffff;
            margin: 60px auto;
            width: 70%;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .slide.active {
            display: block;
        }

        .keyword {
            font-size: 42px;
            font-weight: bold;
            color: #ff5722;
        }

        button {
            padding: 12px 28px;
            font-size: 18px;
            margin: 10px;
            border: none;
            border-radius: 30px;
            background: #ff9800;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #f57c00;
        }
    </style>
</head>

<body>

    <div class="slide active">
        <p>My mood completely depends on <b>Food</b>.</p>
    </div>

    <div class="slide">
        <p>No matter how full I am, there is space for <b>Pizza</b>.</p>
    </div>

    <div class="slide">
        <p>Diet starts tomorrow, today we eat <b>Burger</b>.</p>
    </div>

    <div class="slide">
        <p>Life is uncertain. Eat <b>Chocolate</b> first.</p>
    </div>

    <button onclick="prevSlide()">⬅ Back</button>
    <button onclick="nextSlide()">Next ➡</button>

    <script>
        let slides = document.querySelectorAll(".slide");
        let currentSlide = 0;

        // food keywords
        let keywords = ["Food", "Pizza", "Burger", "Chocolate"];

        for (let i = 0; i < slides.length; i++) {
            let text = slides[i].innerHTML;

            for (let j = 0; j < keywords.length; j++) {
                let word = keywords[j];
                text = text.split(word).join('<span class="keyword">' + word + '</span>');
            }

            slides[i].innerHTML = text;
        }

        function showSlide(index) {
            for (let i = 0; i < slides.length; i++) {
                slides[i].classList.remove("active");
            }
            slides[index].classList.add("active");
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % slides.length;
            showSlide(currentSlide);
        }

        function prevSlide() {
            currentSlide = (currentSlide - 1 + slides.length) % slides.length;
            showSlide(currentSlide);
        }
    </script>

</body>
</html>
