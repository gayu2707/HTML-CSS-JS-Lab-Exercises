<!DOCTYPE html>
<html>
<head>
    <title>Book Status</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }
    </style>
</head>
<body>

<h2>Library Books</h2>
<div id="show"></div>

<script>
    var books = [
        {
            title: "The Road Ahead",
            author: "Bill Gates",
            readingStatus: true
        },
        {
            title: "Walter Isaacson",
            author: "Steve Jobs",
            readingStatus: true
        },
        {
            title: "The Hunger Games",
            author: "Suzanne Collins",
            readingStatus: false
        }
    ];

    var box = document.getElementById("show");

    for (var i = 0; i < books.length; i++) {
        var msg = "";

        if (books[i].readingStatus) {
            msg = "Already read '" + books[i].title + "' by " + books[i].author + ".";
        } else {
            msg = "You still need to read '" + books[i].title + "' by " + books[i].author + ".";
        }

        var para = document.createElement("p");
        para.innerText = msg;
        box.appendChild(para);
    }
</script>

</body>
</html>
