<!DOCTYPE html>
<html>
<head>
    <title>Variable Types</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }
        p {
            font-size: 18px;
        }
    </style>
</head>
<body>

<h3>Variable Types Example</h3>

<script>
    // Simple variable names
    var num = 25;          // number
    var flag = false;      // boolean
    var text = "Hello JS"; // string

    // Display value and type
    document.write("<p>num: " + num + " (type: " + typeof num + ")</p>");
    document.write("<p>flag: " + flag + " (type: " + typeof flag + ")</p>");
    document.write("<p>text: " + text + " (type: " + typeof text + ")</p>");
</script>

</body>
</html>
